<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mercado C2C - Tu Marketplace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            mlYellow: '#FFF159',
            mlBlue: '#3483FA',
            mlDark: '#2D3277',
            temuOrange: '#FF5000'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

  <!-- Header tipo Mercado Libre -->
  <header class="bg-mlYellow shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-2">
        <i class="fa-solid font-bold text-2xl text-blue-900 fa-store"></i>
        <h1 class="text-2xl font-black text-gray-900 tracking-tight">Mercado<span class="text-blue-600">C2C</span></h1>
      </div>

      <!-- Buscador principal -->
      <div class="flex-1 max-w-2xl mx-4">
        <div class="flex shadow-sm rounded-md overflow-hidden">
          <input type="text" id="searchInput" placeholder="Buscar productos, marcas y más..." class="w-full px-4 py-2 border-none focus:outline-none text-gray-700" />
          <button id="btnSearch" class="bg-white px-5 text-gray-500 hover:text-blue-600 transition">
            <i class="fa-solid fa-magnifying-glass"></i>
          </button>
        </div>
      </div>

      <!-- Acciones de Usuario -->
      <div class="flex items-center gap-3" id="userAuthContainer">
        <button onclick="toggleModal('modalRegister')" class="bg-white text-gray-800 px-4 py-2 rounded-md font-medium text-sm hover:bg-gray-50 shadow-sm transition">Registrarse</button>
        <button onclick="toggleModal('modalProduct')" class="bg-mlBlue text-white px-4 py-2 rounded-md font-medium text-sm hover:bg-blue-600 shadow-sm transition"><i class="fa-solid fa-plus mr-1"></i> Publicar</button>
      </div>
    </div>
  </header>

  <!-- Banner estilo Ofertas -->
  <div class="bg-gradient-to-r from-orange-500 to-red-600 text-white text-center py-2 px-4 text-xs font-bold tracking-wide flex justify-center items-center gap-2">
    <span>🔥 OFERTAS C2C DEL DÍA — Envíos asegurados y compras directas entre usuarios</span>
  </div>

  <!-- Contenido Principal -->
  <main class="max-w-7xl mx-auto px-4 py-6 grid grid-cols-1 md:grid-cols-4 gap-6">

    <!-- Filtros Laterales -->
    <aside class="bg-white p-5 rounded-lg shadow-sm border border-gray-200 h-fit">
      <h3 class="font-bold text-lg mb-4 text-gray-800 border-b pb-2">Filtros de búsqueda</h3>
      
      <div class="mb-4">
        <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-2">Categoría</label>
        <select id="filterCategory" class="w-full p-2 border border-gray-300 rounded-md text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
          <option value="">Todas las categorías</option>
          <option value="Tecnología">Tecnología</option>
          <option value="Ropa">Ropa y Moda</option>
          <option value="Hogar">Hogar y Muebles</option>
          <option value="Deportes">Deportes</option>
        </select>
      </div>

      <div class="mb-4">
        <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-2">Rango de Precio ($)</label>
        <div class="flex items-center gap-2">
          <input type="number" id="minPrice" placeholder="Mín" class="w-1/2 p-2 border border-gray-300 rounded-md text-sm" />
          <span class="text-gray-400">-</span>
          <input type="number" id="maxPrice" placeholder="Máx" class="w-1/2 p-2 border border-gray-300 rounded-md text-sm" />
        </div>
      </div>

      <button id="btnFilter" class="w-full bg-mlBlue text-white py-2 rounded-md font-semibold text-sm hover:bg-blue-600 transition shadow">
        Aplicar Filtros
      </button>
    </aside>

    <!-- Grilla de Productos -->
    <section class="md:col-span-3">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-bold text-gray-800">Productos Destacados</h2>
        <span id="productCount" class="text-sm text-gray-500">Cargando catálogo...</span>
      </div>

      <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
        <!-- Tarjetas dinámicas cargadas mediante main.js -->
      </div>
    </section>
  </main>

  <!-- Modal: Registro de Usuario -->
  <div id="modalRegister" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl shadow-2xl max-w-md w-full p-6 relative">
      <button onclick="toggleModal('modalRegister')" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-xl"></i></button>
      <h3 class="text-xl font-bold mb-4 text-gray-800">Crear Cuenta C2C</h3>
      <form id="formRegister" class="space-y-3">
        <input type="text" id="regName" placeholder="Nombre Completo" required class="w-full p-2.5 border border-gray-300 rounded-md text-sm" />
        <input type="email" id="regEmail" placeholder="Correo Electrónico" required class="w-full p-2.5 border border-gray-300 rounded-md text-sm" />
        <input type="password" id="regPassword" placeholder="Contraseña" required class="w-full p-2.5 border border-gray-300 rounded-md text-sm" />
        <input type="text" id="regPhone" placeholder="Teléfono" required class="w-full p-2.5 border border-gray-300 rounded-md text-sm" />
        <button type="submit" class="w-full bg-green-600 text-white py-2.5 rounded-md font-bold hover:bg-green-700 transition">Guardar Registro</button>
      </form>
    </div>
  </div>

  <!-- Modal: Publicar Producto -->
  <div id="modalProduct" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl shadow-2xl max-w-md w-full p-6 relative">
      <button onclick="toggleModal('modalProduct')" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-xl"></i></button>
      <h3 class="text-xl font-bold mb-4 text-gray-800">Publicar un Producto</h3>
      <form id="formProduct" class="space-y-3">
        <input type="text" id="prodTitle" placeholder="Título del Producto" required class="w-full p-2.5 border border-gray-300 rounded-md text-sm" />
        <textarea id="prodDesc" placeholder="Descripción detallada" required class="w-full p-2.5 border border-gray-300 rounded-md text-sm"></textarea>
        <input type="number" id="prodPrice" placeholder="Precio ($)" required class="w-full p-2.5 border border-gray-300 rounded-md text-sm" />
        <select id="prodCategory" required class="w-full p-2.5 border border-gray-300 rounded-md text-sm">
          <option value="Tecnología">Tecnología</option>
          <option value="Ropa">Ropa y Moda</option>
          <option value="Hogar">Hogar y Muebles</option>
          <option value="Deportes">Deportes</option>
        </select>
        <input type="text" id="prodImage" placeholder="URL de Imagen (Opcional)" class="w-full p-2.5 border border-gray-300 rounded-md text-sm" />
        <button type="submit" class="w-full bg-mlBlue text-white py-2.5 rounded-md font-bold hover:bg-blue-600 transition">Publicar Ahora</button>
      </form>
    </div>
  </div>

  <script src="src/main.js"></script>
</body>
</html>
