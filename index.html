<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GIATE - Marketplace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            spotGreen: '#1DB954',
            spotGreenHover: '#1ed760',
            spotDark: '#121212',
            spotCard: '#181818',
            spotHover: '#282828',
            spotInput: '#2a2a2a',
            spotTextMuted: '#b3b3b3'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-spotDark text-white font-sans min-h-screen selection:bg-spotGreen selection:text-black">

  <!-- Header / Navbar Navbar -->
  <header class="bg-black/90 backdrop-blur-md sticky top-0 z-50 border-b border-white/10">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between gap-4">
      
      <!-- Logo GIATE -->
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-spotGreen flex items-center justify-center text-black font-black text-xl shadow-lg shadow-spotGreen/20">
          <i class="fa-solid fa-store"></i>
        </div>
        <h1 class="text-2xl font-bold tracking-tight text-white">
          GIATE<span class="text-spotGreen">.</span>
        </h1>
      </div>

      <!-- Buscador -->
      <div class="flex-1 max-w-xl mx-2">
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-spotTextMuted"></i>
          <input 
            type="text" 
            id="searchInput" 
            placeholder="¿Qué deseas buscar hoy?" 
            class="w-full bg-spotInput text-white pl-11 pr-12 py-3 rounded-full border border-transparent focus:border-white/20 focus:outline-none focus:ring-2 focus:ring-spotGreen text-sm transition placeholder-spotTextMuted"
          />
          <button id="btnSearch" class="absolute right-2 top-1/2 -translate-y-1/2 bg-spotGreen text-black font-bold p-2 rounded-full hover:scale-105 transition">
            <i class="fa-solid fa-arrow-right text-xs"></i>
          </button>
        </div>
      </div>

      <!-- Botones de Acción -->
      <div class="flex items-center gap-3" id="userAuthContainer">
        <button 
          onclick="toggleModal('modalRegister')" 
          class="text-spotTextMuted hover:text-white font-bold text-sm px-4 py-2 transition rounded-full hover:scale-105">
          Registrarse
        </button>
        <button 
          onclick="toggleModal('modalProduct')" 
          class="bg-spotGreen text-black font-bold text-sm px-5 py-2.5 rounded-full hover:bg-spotGreenHover transition transform hover:scale-105 shadow-md shadow-spotGreen/20 flex items-center gap-2">
          <i class="fa-solid fa-plus text-xs"></i> Publicar
        </button>
      </div>

    </div>
  </header>

  <!-- Banner Informativo -->
  <div class="bg-gradient-to-r from-emerald-900/60 via-spotDark to-emerald-900/60 border-b border-white/5 py-2.5 px-4 text-center text-xs font-semibold text-spotTextMuted">
    <span class="text-spotGreen font-bold mr-1"><i class="fa-solid fa-bolt"></i> GIATE MARKETPLACE:</span> Sistema de comercio directo de usuario a usuario.
  </div>

  <!-- Contenido Principal -->
  <main class="max-w-7xl mx-auto px-6 py-8 grid grid-cols-1 md:grid-cols-4 gap-8">

    <!-- Panel Lateral: Filtros -->
    <aside class="bg-spotCard p-6 rounded-2xl border border-white/5 h-fit shadow-xl">
      <div class="flex items-center justify-between mb-6 pb-3 border-b border-white/10">
        <h3 class="font-bold text-lg text-white flex items-center gap-2">
          <i class="fa-solid fa-sliders text-spotGreen"></i> Filtros
        </h3>
      </div>
      
      <div class="mb-5">
        <label class="block text-xs font-bold text-spotTextMuted uppercase tracking-wider mb-2">Categoría</label>
        <select id="filterCategory" class="w-full bg-spotInput text-white p-3 border border-white/10 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-spotGreen cursor-pointer">
          <option value="">Todas las categorías</option>
          <option value="Tecnología">Tecnología</option>
          <option value="Ropa">Ropa y Moda</option>
          <option value="Hogar">Hogar y Muebles</option>
          <option value="Deportes">Deportes</option>
        </select>
      </div>

      <div class="mb-6">
        <label class="block text-xs font-bold text-spotTextMuted uppercase tracking-wider mb-2">Rango de Precio ($)</label>
        <div class="flex items-center gap-2">
          <input type="number" id="minPrice" placeholder="Mín" class="w-1/2 bg-spotInput text-white p-2.5 border border-white/10 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-spotGreen" />
          <span class="text-spotTextMuted">-</span>
          <input type="number" id="maxPrice" placeholder="Máx" class="w-1/2 bg-spotInput text-white p-2.5 border border-white/10 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-spotGreen" />
        </div>
      </div>

      <button id="btnFilter" class="w-full bg-spotGreen text-black py-3 rounded-full font-bold text-sm hover:bg-spotGreenHover transition transform active:scale-95 shadow-lg shadow-spotGreen/10">
        Aplicar Filtros
      </button>
    </aside>

    <!-- Grilla de Productos -->
    <section class="md:col-span-3">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold text-white tracking-tight">Publicaciones Recientes</h2>
        <span id="productCount" class="text-xs text-spotTextMuted font-semibold bg-spotCard px-3 py-1.5 rounded-full border border-white/5">Cargando catálogo...</span>
      </div>

      <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Renderizado dinámico de productos -->
      </div>
    </section>

  </main>

  <!-- Modal: Registro de Usuario -->
  <div id="modalRegister" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden items-center justify-center p-4 z-50">
    <div class="bg-spotCard border border-white/10 rounded-2xl shadow-2xl max-w-md w-full p-6 relative">
      <button onclick="toggleModal('modalRegister')" class="absolute top-4 right-4 text-spotTextMuted hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
      <h3 class="text-xl font-bold mb-4 text-white">Crear Cuenta en GIATE</h3>
      <form id="formRegister" class="space-y-4">
        <input type="text" id="regName" placeholder="Nombre Completo" required class="w-full bg-spotInput text-white p-3 border border-white/10 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-spotGreen" />
        <input type="email" id="regEmail" placeholder="Correo Electrónico" required class="w-full bg-spotInput text-white p-3 border border-white/10 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-spotGreen" />
        <input type="password" id="regPassword" placeholder="Contraseña" required class="w-full bg-spotInput text-white p-3 border border-white/10 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-spotGreen" />
        <input type="text" id="regPhone" placeholder="Teléfono / Contacto" required class="w-full bg-spotInput text-white p-3 border border-white/10 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-spotGreen" />
        <button type="submit" class="w-full bg-spotGreen text-black py-3 rounded-full font-bold hover:bg-spotGreenHover transition shadow-lg shadow-spotGreen/20">Registrarme</button>
      </form>
    </div>
  </div>

  <!-- Modal: Publicar Producto -->
  <div id="modalProduct" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden items-center justify-center p-4 z-50">
    <div class="bg-spotCard border border-white/10 rounded-2xl shadow-2xl max-w-md w-full p-6 relative">
      <button onclick="toggleModal('modalProduct')" class="absolute top-4 right-4 text-spotTextMuted hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
      <h3 class="text-xl font-bold mb-4 text-white">Publicar Producto en GIATE</h3>
      <form id="formProduct" class="space-y-4">
        <input type="text" id="prodTitle" placeholder="Título del Producto" required class="w-full bg-spotInput text-white p-3 border border-white/10 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-spotGreen" />
        <textarea id="prodDesc" placeholder="Descripción detallada" required class="w-full bg-spotInput text-white p-3 border border-white/10 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-spotGreen h-24"></textarea>
        <input type="number" id="prodPrice" placeholder="Precio ($)" required class="w-full bg-spotInput text-white p-3 border border-white/10 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-spotGreen" />
        <select id="prodCategory" required class="w-full bg-spotInput text-white p-3 border border-white/10 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-spotGreen">
          <option value="Tecnología">Tecnología</option>
          <option value="Ropa">Ropa y Moda</option>
          <option value="Hogar">Hogar y Muebles</option>
          <option value="Deportes">Deportes</option>
        </select>
        <input type="text" id="prodImage" placeholder="URL de Imagen (Opcional)" class="w-full bg-spotInput text-white p-3 border border-white/10 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-spotGreen" />
        <button type="submit" class="w-full bg-spotGreen text-black py-3 rounded-full font-bold hover:bg-spotGreenHover transition shadow-lg shadow-spotGreen/20">Publicar Ahora</button>
      </form>
    </div>
  </div>

  <script src="src/main.js"></script>
</body>
</html>
